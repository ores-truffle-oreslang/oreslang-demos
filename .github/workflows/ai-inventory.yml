name: AI example inventory integrity

on:
  pull_request:
    paths:
      - 'ai/**'
      - 'AGENTS.md'
      - 'cli/*.ores'
      - 'desktop-app/*.ores'
      - 'web-server/*.ores'
      - 'interop/*.ores'
      - '.github/workflows/ai-inventory.yml'
  push:
    branches: [main]
    paths:
      - 'ai/**'
      - 'AGENTS.md'
      - 'cli/*.ores'
      - 'desktop-app/*.ores'
      - 'web-server/*.ores'
      - 'interop/*.ores'
      - '.github/workflows/ai-inventory.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # historical commit tree must be present
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.20.0'
      - name: Adversarial manifest tests (NOT compilation)
        run: node --test ai/check-examples.test.mjs
      - name: Verify historical Git tree and pinned source bytes (NOT compilation)
        run: node ai/check-examples.mjs
