name: Exact compiler demo matrix
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-compiler:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, oreslang-jdk25]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Require exact clean compiler checkout
        shell: bash
        run: |
          set -euo pipefail
          : "${ORESLANG_SOURCE_DIR:?Trusted runner must provide ORESLANG_SOURCE_DIR}"
          expected="$(tr -d '[:space:]' < SOURCE_REF)"
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C "$ORESLANG_SOURCE_DIR" rev-parse HEAD)" = "$expected"
          test -z "$(git -C "$ORESLANG_SOURCE_DIR" status --porcelain --untracked-files=all)"
      - name: Check exact matrix syntax
        run: bash -n scripts/run-exact-compiler-matrix.sh
      - name: Execute authored demo boundaries
        run: bash scripts/run-exact-compiler-matrix.sh
