name: host-shells

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-host-shells:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Compile desktop host
        run: javac desktop-app/DesktopHost.java
      - name: Compile web host
        run: javac web-server/HttpHost.java
      - name: Check shell scripts
        run: |
          sh -n cli/run.sh
          sh -n desktop-app/run.sh
          sh -n web-server/run.sh
      - name: Verify authored Oreslang file counts
        run: |
          test "$(find cli -maxdepth 1 -name '*.ores' | wc -l)" -eq 3
          test "$(find web-server -maxdepth 1 -name '*.ores' | wc -l)" -eq 3
          test "$(find desktop-app -maxdepth 1 -name '*.ores' | wc -l)" -ge 4
