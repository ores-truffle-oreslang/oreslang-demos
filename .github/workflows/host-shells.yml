name: host-shells

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-host-shells:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Compile desktop host with warnings
        run: javac -Xlint:all desktop-app/DesktopHost.java
      - name: Compile and test web host with warnings
        run: |
          javac -Xlint:all web-server/HttpHost.java web-server/HttpHostContractTest.java
          java -cp web-server HttpHostContractTest
      - name: Check shell scripts
        run: |
          sh -n cli/run.sh
          sh -n desktop-app/run.sh
          sh -n web-server/run.sh
          sh -n interop/run-java-embeds-oreslang.sh
          sh -n interop/run-oreslang-embeds-java.sh
          sh -n scripts/stitch-ores.sh
          sh -n scripts/test-stitch.sh
      - name: Verify bounded source stitching
        run: sh scripts/test-stitch.sh
      - name: Verify secure temporary-directory handling
        run: |
          grep -q 'mktemp -d' cli/run.sh
          grep -q 'mktemp -d' desktop-app/run.sh
          grep -q 'mktemp -d' web-server/run.sh
          grep -q 'mktemp -d' interop/run-oreslang-embeds-java.sh
          ! grep -R --include='run*.sh' 'demo-\$\$\|interop-\$\$' cli desktop-app web-server interop
      - name: Verify authored Oreslang file counts
        run: |
          test "$(find cli -maxdepth 1 -name '*.ores' | wc -l)" -eq 3
          test "$(find web-server -maxdepth 1 -name '*.ores' | wc -l)" -eq 3
          test "$(find desktop-app -maxdepth 1 -name '*.ores' | wc -l)" -ge 4
          test "$(find interop -maxdepth 1 -name '*.ores' | wc -l)" -ge 1
          test -z "$(find cli desktop-app web-server interop -type l -name '*.ores' -print -quit)"
      - name: Verify mixed-source interop examples
        run: |
          grep -q 'define module embedded_math' interop/JavaEmbedsOreslang.java
          grep -q 'public final class HelloFromGeneratedJava' interop/OreslangEmbedsJava.ores
