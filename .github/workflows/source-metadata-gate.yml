name: Demo metadata and source gate
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source and parse JSON fixtures (host-only)
        shell: bash
        env:
          EXPECTED_DEMO_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_DEMO_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_DEMO_SHA"
          node -e 'const fs=require("node:fs"); for (const p of process.argv.slice(1)) JSON.parse(fs.readFileSync(p,"utf8"));' .oreslang/integration.json ai/examples.manifest.json
      - name: Execute stitcher negative and round-trip tests
        run: sh scripts/test-stitch.sh
      - name: Ensure authored Oreslang is neither symlink nor empty
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            test ! -L "$file"
            test -s "$file"
          done < <(find cli desktop-app web-server interop -name '*.ores' -print0)
